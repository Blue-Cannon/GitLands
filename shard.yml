name: gitlands
version: 0.1.0

authors:
  - BlueBixt <newssungoldentoday@gmail.com>

targets:
  gitlands:
    main: src/gitlands.cr

dependencies:
  # The web framework to handle HTTP requests and Git Smart Protocol streams
  kemal:
    github: kemalcr/kemal

  # The ORM to connect GitLands to your database (PostgreSQL/SQLite/MySQL)
  granite:
    github: granite-orm/granite

  # Database driver (using SQLite here for rapid, zero-config local prototyping)
  sqlite3:
    github: crystal-lang/crystal-sqlite3
